<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кино на вечер</title>
<style>
body{font:16px system-ui,sans-serif;background:#f5f2eb;color:#252525;margin:0}main{max-width:920px;margin:40px auto;padding:0 20px}h1{font-size:42px;margin-bottom:8px}p{color:#555}.card{background:white;border:1px solid #ddd6ca;border-radius:12px;padding:22px;margin:18px 0}button{background:#315d9b;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}input,select{padding:10px;border:1px solid #bbb;border-radius:7px}input[type=search]{width:min(100%,400px)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.film{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:15px}.small{font-size:13px;color:#666}.error{color:#a32323}#picked{padding-left:20px}.result{padding:10px 0;border-top:1px solid #eee}
</style>
<main><h1>Кино на вечер</h1><p>Найдите фильмы, оцените несколько понравившихся и получите персональные рекомендации.</p>
<section class="card"><h2>1. Данные</h2><p id="status">Проверяем состояние…</p><div class="row"><button onclick="run('/import-all', 'Данные загружены')">Загрузить MovieLens</button><button onclick="run('/train', 'Модель обучена')">Обучить модель</button></div><p class="small">Первая загрузка и обучение могут занять несколько минут.</p></section>
<section class="card"><h2>2. Поиск и оценки</h2><div class="row"><input id="query" type="search" placeholder="Название фильма, например Matrix"><button onclick="search()">Найти</button></div><div id="movies"></div><h3>Выбранные фильмы</h3><ol id="picked"></ol></section>
<section class="card"><h2>3. Рекомендации</h2><button onclick="recommend()">Подобрать фильмы</button><div id="results"></div></section>
<p id="message"></p></main>
<script>
const API='http://localhost:8000'; const choices=new Map();
async function call(path,method='GET',body){const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.text()).slice(0,300));return r.json()}
function message(text,error=false){let e=document.querySelector('#message');e.textContent=text;e.className=error?'error':''}
async function status(){try{const x=await call('/status');document.querySelector('#status').textContent=`В базе: ${x.storage.movies} фильмов, ${x.storage.ratings} оценок. Модель: ${x.model.status}.`;}catch(e){message(e.message,true)}}
async function run(path,ok){message('Выполняется…');try{await call(path,'POST');message(ok);await status();if(path==='/import-all')await search()}catch(e){message(e.message,true)}}
function renderPicked(){document.querySelector('#picked').innerHTML=[...choices.values()].map(x=>`<li>${escapeHtml(x.title)} — ${x.rating}/5 <button onclick="choices.delete(${x.movieId});renderPicked()">Убрать</button></li>`).join('')||'<li>Пока ничего не выбрано</li>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function search(){try{const q=document.querySelector('#query').value;const data=await call('/movies?q='+encodeURIComponent(q));const root=document.querySelector('#movies');root.innerHTML='';for(const movie of data.items){const div=document.createElement('div');div.className='film';div.innerHTML=`<div><b>${escapeHtml(movie.title)}</b><div class="small">${escapeHtml(movie.genres)}</div></div>`;const select=document.createElement('select');for(let v=5;v>=0.5;v-=0.5){const option=document.createElement('option');option.value=v;option.textContent=v+'/5';select.append(option)}const button=document.createElement('button');button.textContent='Оценить';button.onclick=()=>{choices.set(movie.movieId,{movieId:movie.movieId,title:movie.title,rating:Number(select.value)});renderPicked()};const controls=document.createElement('div');controls.className='row';controls.append(select,button);div.append(controls);root.append(div)}if(!data.items.length)root.textContent='Ничего не найдено'}catch(e){message(e.message,true)}}
async function recommend(){if(!choices.size){message('Сначала оцените хотя бы один фильм',true);return}message('Подбираем фильмы…');try{const data=await call('/recommend','POST',{choices:[...choices.values()].map(({movieId,rating})=>({movieId,rating})),limit:10});document.querySelector('#results').innerHTML=data.items.map((x,i)=>`<div class="result"><b>${i+1}. ${escapeHtml(x.title)}</b><div class="small">${escapeHtml(x.genres.join(', '))} · сходство ${x.score}</div></div>`).join('');message('Готово')}catch(e){message(e.message,true)}}
document.querySelector('#query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});status();renderPicked();
</script></html>
